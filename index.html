<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Tent Presidential Meme Coin</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #1c2b46;
      --gold: #c4a139;
      --gray: #f5f7fa;
      --font-sans: 'Inter', sans-serif;
      --font-serif: 'Noto Serif KR', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--gray); color: #111; line-height: 1.6; }
    h1,h2,h3 { font-family: var(--font-serif); color: var(--navy); }

    .container { width: min(1200px, 90%); margin-inline: auto; padding-block: 4rem; }

    header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: var(--navy); color: #fff; display: flex; align-items: center; z-index: 1000; }
    header nav { width: min(1200px, 90%); margin-inline: auto; display: flex; justify-content: space-between; align-items: center; }
    header a.logo { font-family: var(--font-serif); font-size: 1.4rem; color: #fff; text-decoration: none; white-space: nowrap; }
    #desktopMenu { list-style: none; display: flex; gap: 2rem; }
    #desktopMenu a { color: #fff; text-decoration: none; font-weight: 600; white-space: nowrap; }
    .menu-btn { display: none; font-size: 1.8rem; cursor: pointer; }
    #mobileMenu { position: fixed; inset: 0 0 0 auto; width: 70%; max-width: 300px; background: var(--navy); transform: translateX(100%); transition: transform .3s ease; padding: 4rem 2rem; }
    #mobileMenu ul { list-style: none; display: flex; flex-direction: column; gap: 1.5rem; }
    #mobileMenu a { color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
    #mobileMenu.open { transform: translateX(0); }

    .hero { height: 100vh; background: url('https://images.unsplash.com/photo-1551836022-4c4c79ecde72?auto=format&fit=crop&w=1600&q=80') center/cover; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; position: relative; }
    .hero::after { content: ''; position: absolute; inset: 0; background: rgba(28,43,70,.6); }
    .hero-content { position: relative; z-index: 1; padding-inline: 1rem; }
    .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); margin-bottom: 1rem; }
    .hero p { font-size: 1.1rem; margin-bottom: 2rem; max-width: 50ch; margin-inline: auto; }
    .btn { display: inline-block; padding: .75rem 1.5rem; border-radius: 6px; font-weight: 600; letter-spacing: .02em; text-decoration: none; transition: background .25s ease; }
    .btn-primary { background: var(--gold); color: var(--navy); }
    .btn-secondary { background: transparent; border: 2px solid var(--gold); color: #fff; }
    .btn-primary:hover { background: #b7932e; }
    .btn-secondary:hover { background: rgba(255,255,255,.15); }

    .vision { background: #fff; }
    .vision .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 2rem; margin-top: 2rem; }
    .vision article { background: var(--gray); padding: 2rem; border-radius: 8px; transition: transform .25s; }
    .vision article:hover { transform: translateY(-4px); }

    .roadmap { background: var(--navy); color: #fff; }
    .timeline { position: relative; margin-top: 3rem; }
    .timeline::before { content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 4px; height: 100%; background: var(--gold); }
    .milestone { position: relative; width: 50%; padding: 1.5rem 2rem; }
    .milestone:nth-child(odd) { left: 0; text-align: right; }
    .milestone:nth-child(even) { left: 50%; }
    .milestone h3 { margin-bottom: .5rem; color: #fff; }
    .milestone::before { content: ''; position: absolute; top: 1.8rem; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
    .milestone:nth-child(odd)::before { right: -6px; }
    .milestone:nth-child(even)::before { left: -6px; }

    .participate { background: #fff; }
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 1.5rem; margin-top: 2rem; }
    .step { background: var(--gray); padding: 1.5rem; border-radius: 8px; }
    .step span { display: block; font-size: 2rem; font-weight: 600; color: var(--gold); }

    .updates { background: var(--gray); }
    .updates ul { list-style: none; margin-top: 2rem; }
    .updates li { background: #fff; padding: 1rem 1.5rem; margin-bottom: 1rem; border-left: 4px solid var(--gold); }

    footer { background: var(--navy); color: #fff; text-align: center; padding: 2rem 1rem; }

    @media (max-width: 767px) {
      #desktopMenu { display: none; }
      .menu-btn { display: block; }
      .timeline::before { left: 8px; }
      .milestone { width: 100%; left: 0 !important; padding-left: 2.5rem; text-align: left !important; }
      .milestone::before { left: -14px !important; }
    }
    @media (min-width: 768px) {
      #mobileMenu { display: none; }
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <header>
    <nav>
      <a href="#" class="logo">BIG TENT COIN (HDS)</a>
      <span class="menu-btn" onclick="toggleMenu()">☰</span>
      <ul id="desktopMenu">
        <li><a href="#vision">그의 한마디</a></li>
        <li><a href="#roadmap">로드맵</a></li>
        <li><a href="#participate">밈코인 구매</a></li>
        <li><a href="#updates">업데이트</a></li>
      </ul>
    </nav>
    <div id="mobileMenu">
      <ul>
        <li><a href="#vision" onclick="toggleMenu()">그의 한마디</a></li>
        <li><a href="#roadmap" onclick="toggleMenu()">로드맵</a></li>
        <li><a href="#participate" onclick="toggleMenu()">밈코인 구매</a></li>
        <li><a href="#updates" onclick="toggleMenu()">업데이트</a></li>
      </ul>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1>Big Tent</h1>
      <p>한덕수</p>
      <p>CA : On Process</p>
      <a href="#participate" class="btn btn-primary">빅텐트 코인 구매</a>
      <a href="#vision" class="btn btn-secondary" style="margin-left:1rem;">그의 한마디</a>
    </div>
  </section>

  <!-- JS -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('open');
    }

    function connectWallet() {
      window.open('https://jup.ag', '_blank');
    }
  </script>
</body>
</html>
